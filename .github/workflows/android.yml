name: Lumo Android

on:
  push:
    paths:
      - 'app/**'
      - 'build.py'
      - 'tests/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android-screens.sh'
  pull_request:
    paths:
      - 'app/**'
      - 'build.py'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Testes e APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Testes de contrato
        run: |
          set -e
          for t in tests/*.py; do echo "== $t"; python3 "$t"; done
      - name: Compilar APK
        run: python3 build.py
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Android
          path: Lumo.apk
          if-no-files-found: error
      - name: Publicar no release lumo-latest (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lumo-latest >/dev/null 2>&1 || gh release create lumo-latest --prerelease --title "Lumo · última versão" --notes "Builds automáticos da main: Lumo.apk (Android, assinado com a chave de teste) e Lumo-iOS-unsigned.ipa (instalar com Sideloadly/AltStore)."
          gh release upload lumo-latest Lumo.apk --clobber

  screenshots:
    name: Capturas no emulador
    needs: apk
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Lumo-Android
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador e capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/android-screens.sh
      - name: Publicar capturas na branch ci/android-screenshots
        run: |
          set -e
          dir=$(mktemp -d)
          cp screenshots/*.png "$dir/"
          cd "$dir"
          git init -q
          git checkout -q -b ci/android-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Capturas Android de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/android-screenshots
