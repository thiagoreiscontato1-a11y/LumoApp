name: Lumo Android

on:
  push:
    paths:
      - 'app/**'
      - 'build.py'
      - 'tests/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android-screens.sh'
  pull_request:
    paths:
      - 'app/**'
      - 'build.py'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Testes e APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OpenGL por software (Mesa) para o teste dos shaders
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
          python -m pip install -q moderngl numpy
      - name: Testes de contrato
        env:
          GPU_TEST_REQUIRED: '1'
        run: |
          set -e
          for t in tests/*.py; do echo "== $t"; python "$t"; done
      # Chave de produção e Sentry vêm dos Secrets (veja ASSINATURA.md). Sem eles, o build usa a chave de TESTE.
      - name: Compilar APK
        env:
          LUMO_KEYSTORE_BASE64: ${{ secrets.LUMO_KEYSTORE_BASE64 }}
          LUMO_KEYSTORE_PASSWORD: ${{ secrets.LUMO_KEYSTORE_PASSWORD }}
          LUMO_KEY_ALIAS: ${{ secrets.LUMO_KEY_ALIAS }}
          LUMO_KEY_PASSWORD: ${{ secrets.LUMO_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -e
          python3 build.py
          LUMO_DEMO=1 python3 build.py
          if [ -n "$LUMO_KEYSTORE_BASE64" ]; then echo "LUMO_SIGNING=producao" >> "$GITHUB_ENV"; else
            echo "LUMO_SIGNING=teste" >> "$GITHUB_ENV"
            echo "::warning::APK assinado com a chave de TESTE. Cadastre LUMO_KEYSTORE_BASE64, LUMO_KEYSTORE_PASSWORD e LUMO_KEY_ALIAS (veja ASSINATURA.md) antes de distribuir a clientes."
          fi
          [ -n "$SENTRY_DSN" ] || echo "::notice::SENTRY_DSN não cadastrado: os relatórios de falha ficam só no aparelho (Menu → Relatórios de falha → Compartilhar)."
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Android
          path: |
            Lumo.apk
            Lumo-Demo.apk
          if-no-files-found: error
      - name: Publicar no release lumo-latest (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LUMO_SIGNING" = producao ]; then key="assinados com a chave de produção"; else key="assinados com a chave de TESTE (não distribuir a clientes)"; fi
          notes="Builds automáticos da main: Lumo.apk e Lumo-Demo.apk (Android, $key) e Lumo-iOS-unsigned.ipa (instalar com Sideloadly/AltStore)."
          gh release view lumo-latest >/dev/null 2>&1 || gh release create lumo-latest --prerelease --title "Lumo · última versão" --notes "$notes"
          gh release upload lumo-latest Lumo.apk Lumo-Demo.apk --clobber
          gh release edit lumo-latest --notes "$notes"

  screenshots:
    name: Capturas no emulador
    needs: apk
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Lumo-Android
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador e capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/android-screens.sh
      - name: Publicar capturas na branch ci/android-screenshots
        run: |
          set -e
          dir=$(mktemp -d)
          cp screenshots/*.png "$dir/"
          cd "$dir"
          git init -q
          git checkout -q -b ci/android-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Capturas Android de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/android-screenshots
      - name: Revelação na GPU (emulador)
        run: |
          cat screenshots/gpu.txt 2>/dev/null || echo "sem registro da GPU"
          { echo "## Revelação na GPU (emulador)"; echo '```'; cat screenshots/gpu.txt 2>/dev/null || echo "sem registro"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f screenshots/gpu-diverge.txt ]; then echo "::error::A revelação na GPU divergiu do motor Java (veja acima)."; exit 1; fi
      - name: Falhar se o app fechou no emulador
        run: |
          if [ -s screenshots/crash.txt ]; then
            cat screenshots/crash.txt
            echo "::error::O Lumo fechou durante as capturas (veja o log acima)."
            exit 1
          fi
          echo "Nenhum fechamento do app durante as capturas."
